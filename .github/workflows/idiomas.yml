name: Idiomas
# T94: las traducciones se editan en idiomas/*.json (a mano o desde Weblate, que manda sus cambios como PR). La web carga
# data/idiomas/*.js, que se generan desde esos JSON: cuando el JSON cambia en main, aquí se regeneran y se publican.
on:
  push:
    branches: [main]
    paths: ['idiomas/**']
  workflow_dispatch: {}
permissions: { contents: write, pages: write }
# El mismo grupo que la revisión diaria de datos y la hoja de ruta: todos publican en main y no deben empujar a la vez.
concurrency: { group: actualizar-datos, cancel-in-progress: false }
jobs:
  generar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar las traducciones
        run: python3 -I scripts/idiomas_textos.py --comprobar
      - name: Generar data/idiomas/*.js
        run: python3 -I scripts/idiomas.py
      - name: Publicar en main
        run: |
          git config user.name "atlas-onu-bot"
          git config user.email "atlas-onu-bot@users.noreply.github.com"
          git add data/idiomas/*.js
          if git diff --cached --quiet; then echo "Nada que publicar"; exit 0; fi
          git commit -m "Idiomas: data/idiomas/*.js generados desde idiomas/*.json ($(date -u +%F))"
          git pull --rebase origin main
          git push
      - name: Pedir a GitHub Pages que reconstruya el sitio
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages se reconstruirá con el siguiente cambio"
