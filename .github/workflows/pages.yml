name: Publicar en GitHub Pages
# Alternativa a «Deploy from a branch». Solo manual: úsalo únicamente si en Settings → Pages eliges Source: GitHub Actions.
on:
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v7
      - name: Armar el sitio (solo lo necesario)
        run: |
          mkdir -p _site/data
          cp index.html sw.js manifest.webmanifest _site/
          cp -r assets _site/
          # Todo lo que la página y el service worker piden de data/: los .js y .json de primer nivel, los idiomas, las fichas por
          # país, los textos de tratados, las votaciones (también las de sí/no), el seguimiento del EPU por país (T75) y el Excel
          # (no las carpetas de trabajo: fuentes/…).
          cp data/*.js data/*.json data/cambios.atom data/atlas-onu-catalogo-v07.xlsx _site/data/
          cp -r data/idiomas data/paises data/tratados data/votaciones data/votos_si_no data/seguimiento _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
