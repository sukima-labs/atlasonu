name: Pruebas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: cd tests && node smoke.cjs
      - run: npm i --no-save playwright@1.64.1 && npx playwright install --with-deps chromium && node tests/browser.cjs
