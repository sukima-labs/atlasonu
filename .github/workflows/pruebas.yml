name: Pruebas
on:
  push: { branches: [main] }   # en las demás ramas ya corre por su PR; así un force-push no lanza decenas de ejecuciones
  pull_request: {}
jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd tests && node smoke.cjs
      - run: python3 -I tests/texto_completo_test.py
      - run: python3 -I tests/epu_recomendaciones_test.py   # T68 c: contador de recomendaciones del EPU y datos publicados
      - run: python3 -I tests/hoja_ruta_github_test.py   # T90: la pantalla «Qué falta y qué viene» sigue el estado de los issues
      - run: python3 -I scripts/idiomas_textos.py --comprobar   # T26: inglés y francés cubren la interfaz
      - run: npm i --no-save playwright@1.64.1 axe-core@4.10.2 && npx playwright install --with-deps chromium && node tests/browser.cjs
      - run: node tests/accesibilidad.cjs   # T27: WCAG 2.2 A/AA con axe-core en todas las pantallas
      - run: node tests/impresion.cjs   # T58: cada pantalla se imprime sola, en claro y en pocas hojas
